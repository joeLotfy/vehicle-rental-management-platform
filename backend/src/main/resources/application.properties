spring.application.name=marketplace

# ===================================================================
# DATA SOURCE CONFIGURATION
# ===================================================================

# PostgreSQL Database Connection Settings
# JDBC Java DataBase Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/marketplace_db
spring.datasource.username=postgres
spring.datasource.password=441521
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configurations to control schhema generation and log SQL queries
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.orm.queries=trace

# Schema management (use 'update' or 'create-drop' for dev, 'none' or 'validate' for production)
spring.jpa.hibernate.ddl-auto=update